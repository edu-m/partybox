# partybox.conf: put it next to partybox.efi. One key=value per line;
# any line that isn't a valid entry (like this one) is ignored.

# App highlighted at start and booted when the countdown ends, as a path
# inside PARTYBOX (".efi" optional, / or \ both fine).
selection=doom\PlayDoom.efi

# Autoboot countdown in seconds, 0 = off (default 5).
countdown=10
